# Reusable workflow: actual packaging/release logic used by build.yml. Only triggered via
# workflow_call - never runs on its own. build.yml owns the trigger (tag pattern /
# workflow_dispatch), naming, and which secrets it forwards; this file owns HOW a release
# gets built and published.
name: Package release (reusable)

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref (tag) to check out and package"
        required: true
        type: string
    secrets:
      CF_API_KEY:
        required: false
      # WoWInterface and Wago publishing intentionally disabled - CurseForge and GitHub only.
      # WOWI_API_TOKEN:
      #   required: false
      # WAGO_API_TOKEN:
      #   required: false

jobs:
  package:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write
    env:
      CF_API_KEY: ${{ secrets.CF_API_KEY }}
      GITHUB_OAUTH: ${{ secrets.GITHUB_TOKEN }}
      # WOWI_API_TOKEN: ${{ secrets.WOWI_API_TOKEN }}
      # WAGO_API_TOKEN: ${{ secrets.WAGO_API_TOKEN }}

    steps:
      - name: Clone project
        uses: actions/checkout@v7
        with:
          fetch-depth: 0
          ref: ${{ inputs.ref }}

      - name: Verify changelog placeholder exists
        # CHANGELOG.md keeps "# @project-version@ (@build-time@)" as its heading. The packager
        # only knows @project-version@ - @build-time@ is our own placeholder, replaced in the
        # next step. BloodInTheWater_Changes.log is not touched: its entries carry a literal
        # date written at creation time (see CLAUDE.md's changelog workflow).
        run: |
          grep -q '@build-time@' CHANGELOG.md || { echo "::error file=CHANGELOG.md::Missing @build-time@ placeholder"; exit 1; }

      - name: Update build date in release changelog
        run: sed -i "s/@build-time@/$(date +%Y-%m-%d)/" CHANGELOG.md

      - name: Create package
        # BloodInTheWater.toc declares "## Interface: 120100, 16001" (Retail + WoW Forever, read natively by the client), so
        # the packager builds only that one flavor by default - no per-flavor matrix or -g
        # flag needed. If Classic/Cata/Mists support is ever added via "## Interface-<Type>:"
        # lines in the TOC, restrict this build to Retail only with:
        #   args: -l -n "BloodInTheWater-{project-version}" -g retail
        # Do NOT add "-e" here: it skips the checkout of the .pkgmeta externals, which would
        # ship the release without the embedded Libs/ (Ace3, LibSharedMedia).
        uses: BigWigsMods/packager@v2
        with:
          args: -l -n "BloodInTheWater-{project-version}"
